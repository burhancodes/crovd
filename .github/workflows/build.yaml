name: build docker image

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      cachebust: ${{ steps.decide.outputs.cachebust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check and auto-update Instagram constants
        id: ig_updater
        run: |
          go run ./cmd/update-ig-constants || true
          if [ -n "$(git status --porcelain internal/extractors/instagram/util.go)" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add internal/extractors/instagram/util.go
              git commit -m "chore(instagram): auto-update GQL fingerprint constants"
              git push origin HEAD:${{ github.ref_name }} || true
            fi
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide Whether To Build
        id: decide
        run: |
          case "${{ github.event_name }}" in
            push)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "cachebust=static" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "cachebust=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "${{ steps.ig_updater.outputs.updated }}" = "true" ]; then
                echo "Instagram GQL constants updated, building new image"
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "cachebust=ig-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              else
                latest=$(docker run --rm alpine:3.22 sh -c 'apk update -q >/dev/null 2>&1; apk policy yt-dlp 2>/dev/null | grep -oE "^[0-9][^:]*" | head -1' | sed "s/-r[0-9]*$//")
                current=$(docker run --rm ${{ env.IMAGE }} yt-dlp --version 2>/dev/null || echo "none")
                echo "alpine edge: '$latest' / published: '$current'"
                if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
                  echo "build=true" >> "$GITHUB_OUTPUT"
                  echo "cachebust=$latest" >> "$GITHUB_OUTPUT"
                else
                  echo "build=false" >> "$GITHUB_OUTPUT"
                fi
              fi
              ;;
          esac

  build-images:
    needs: [check]
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update Instagram GQL Constants
        run: |
          go run ./cmd/update-ig-constants || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          file: ./Dockerfile
          build-args: |
            YTDLP_CACHEBUST=${{ needs.check.outputs.cachebust }}
            IG_CACHEBUST=${{ github.run_id }}
          tags: ${{ env.IMAGE }}-${{ matrix.arch }}

  push-manifest:
    needs: [check, build-images]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tagged manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ env.IMAGE }}
          sources: |
            ${{ env.IMAGE }}-amd64
            ${{ env.IMAGE }}-arm64
