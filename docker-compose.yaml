services:
  bot:
    build: .
    image: ghcr.io/burhancodes/crovd:main
    container_name: bot
    restart: unless-stopped
    networks:
      - govd-network
    env_file:
      - .env
    volumes:
      - ./private:/app/private
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    ports:
      - "${METRICS_PORT-}:8080"
      - "${PROFILER_PORT-}:6060"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: govd
      POSTGRES_USER: govd
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql
    networks:
      - govd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govd"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Optional local Telegram Bot API server for 2GB uploads
  # Enable with: docker compose --profile local-bot-api up
  # And set BOT_API_URL=http://telegram-bot-api:8081 in .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    profiles:
      - local-bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH-}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - govd-network

volumes:
  db:
  telegram-bot-api-data:

networks:
  govd-network:
    driver: bridge
